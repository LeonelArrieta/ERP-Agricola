# Mini ERP Agricola - VirtualHost de produccion (Apache 2.4)
# 1. Copiar en la configuracion de Apache (por ejemplo conf/extra/httpd-vhosts.conf).
# 2. Ajustar ServerName y rutas del proyecto.
# 3. Habilitar mod_rewrite y reiniciar Apache.

<VirtualHost *:80>
    ServerName erp.example.com
    DocumentRoot "/ruta/al/proyecto/erp-agricola/public"

    <Directory "/ruta/al/proyecto/erp-agricola/public">
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    # Nada fuera de public/ debe ser accesible por HTTP.
    <Directory "/ruta/al/proyecto/erp-agricola">
        Require all denied
    </Directory>

    <FilesMatch "^\.env|composer\.(json|lock)$">
        Require all denied
    </FilesMatch>

    ErrorLog "logs/erp-agricola-error.log"
    CustomLog "logs/erp-agricola-access.log" combined
</VirtualHost>

# En produccion el trafico debe servirse por HTTPS.
# Configurar el certificado y redirigir todo el trafico HTTP a HTTPS.
